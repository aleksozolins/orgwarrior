# On a v* tag: build and publish to PyPI through trusted publishing (PyPI
# trusts this workflow in the pypi environment; no token is stored).
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # A version can't be uploaded twice: the tag must be the one in pyproject.toml.
      - name: Tag matches the version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
